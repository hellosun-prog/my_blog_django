<!DOCTYPE html>
{% load static %}
<html>

<head>
    <meta charset="UTF-8"/>
    <title>My Blog</title>
    <link rel="stylesheet" href="{% static 'blog/bootstrap/bootstrap.min.css' %}" media="screen">
    <link rel="stylesheet" href="{% static 'single_pages/css/landing.css' %}" media="screen">
    <script src="https://kit.fontawesome.com/fb9a30ced2.js" crossorigin="anonymous"></script>
</head>

<body>

{% include 'blog/navbar.html' %}

<section>
    <div class="container">
        <div class="row justify-content-between">
            <div class="col-lg-6 text-light">
                <h1 class="mt-5">My Blog OOO</h1>
                <p>나의 블로그 사이트에 오신 것을 환영합니다.</p>
            </div>
            <div class="col-lg-5 mt-5">
                <h2 class="text-light">Blog - Recent posts</h2>
                {% for post in recent_posts %}
                <div class="card mt-1">
                    <div class="card-body">
                        <h6><a href="{{ post.get_absolute_url }}"
                               class="text-decoration-none text-dark">{{ post.title }}</a></h6>
                        <span class="badge rounded-pill text-bg-light float-end">
                            <img class="mr-1 rounded-circle" width="20px" src="{{ post.get_avatar_url }}"
                                 alt="{{ post.author }}">
                            {{ post.author.username }}&nbsp;&nbsp;{{ post.created_at }}
                            </span>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
    </div>
</section>

<div class="fixed-bottom">
    {% include 'blog/footer.html' %}
</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
</body>

</html>
